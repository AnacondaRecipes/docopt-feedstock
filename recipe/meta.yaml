{% set name = "docopt" %}
{% set version = "0.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/docopt-{{ version }}.tar.gz
  sha256: 49b3a825280bd66b3aa83585ef59c4a8c82f2c8a522dbe754a8bc8d08c85c491

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv


requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - docopt
  commands:
    - pip check
  requires:
    - pip

about:
  # HTTPS isn't available
  home: http://docopt.org
  summary: Pythonic argument parser, that will make you smile
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE-MIT
  license_url: https://github.com/docopt/docopt/blob/master/LICENSE-MIT
  dev_url: https://github.com/docopt/docopt
  doc_url: https://docopt.readthedocs.io/
  doc_source_url: https://github.com/docopt/docopt/blob/master/README.rst

extra:
  recipe-maintainers:
    - ocefpaf
